{% extends "base.html" %}

{% block step_label %}STEP 3 OF 4{% endblock %}

{% block content %}
<div class="dark-card centered-card loading-card">
  <div class="spinner"></div>
  <div class="loading-text">Generating your {{ type_label|lower }}...</div>
  <div class="loading-sub" id="loading-status">Loading knowledge base...</div>
</div>

<script>
  var statuses = [
    "Loading knowledge base...",
    "Selecting relevant context for \"{{ topic }}\"...",
    "Building the prompt...",
    "Writing with AI Interaction Map context...",
    "Running quality checks..."
  ];
  var i = 0;
  var statusEl = document.getElementById("loading-status");

  var interval = window.setInterval(function () {
    i = (i + 1) % statuses.length;
    statusEl.textContent = statuses[i];
  }, 1400);

  window.setTimeout(function () {
    window.location.href = "{{ url_for('generate_page') }}";
  }, 60);
</script>
{% endblock %}
